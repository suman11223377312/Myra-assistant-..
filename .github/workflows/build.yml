
name: Build MYRA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract MYRA Project
        run: |
          unzip -q MYRA_JARVIS_OnePack.zip -d extracted

      - name: Build APK
        run: |
          cd "extracted/MYRA Ai"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-apk
          path: extracted/MYRA Ai/app/build/outputs/apk/debug/app-debug.apk
          
