
name: Build MYRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -q MYRA_JARVIS_OnePack.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(dirname "$(find extracted -name gradlew -type f | head -1)")
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Android project found: $PROJECT"

      - name: Show AppDetector Source
        run: |
          FILE="$PROJECT/app/src/main/java/com/myra/assistant/automation/AppDetector.kt"
          echo "===== AppDetector.kt lines 155-190 ====="
          nl -ba "$FILE" | sed -n '155,190p'

      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
