
name: Build MYRA JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -q MYRA_JARVIS_OnePack.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(dirname "$(find extracted -name gradlew -type f | head -1)")

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/java/com/myra/assistant/automation/AppDetector.kt" ]; then
            echo "AppDetector.kt not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Fix AppDetector Kotlin Code
        run: |
          FILE="$PROJECT/app/src/main/java/com/myra/assistant/automation/AppDetector.kt"

          python3 - "$FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()

          pattern = r'    fun findAppByKeywords\(\s*service: AccessibilityService,\s*keywords: List<String>\s*\): InstalledApp\? \{.*?\n    \}'

          replacement = """    fun findAppByKeywords(
              service: AccessibilityService,
              keywords: List<String>
          ): InstalledApp? {
              val apps = getLaunchableApps(service, includeSystem = true)
              val normalizedKeywords = keywords.map { normalizeName(it) }

              val scoredApps: List<Pair<InstalledApp, Int>> = apps.map { app ->
                  val label = normalizeName(app.label)
                  val pkg = normalizeName(app.packageName)
                  var score: Int = 0

                  for (keyword in normalizedKeywords) {
                      score += when {
                          label.contains(keyword) -> 30
                          pkg.contains(keyword) -> 20
                          else -> 0
                      }
                  }

                  Pair(app, score)
              }

              return scoredApps
                  .filter { pair -> pair.second > 0 }
                  .sortedByDescending { pair -> pair.second }
                  .firstOrNull()
                  ?.first
          }"""

          updated, count = re.subn(
              pattern,
              lambda match: replacement,
              source,
              count=1,
              flags=re.S
          )

          if count != 1:
              print("Could not safely locate findAppByKeywords")
              sys.exit(1)

          path.write_text(updated)
          print("AppDetector.kt fixed successfully")
          PY

      - name: Inspect MYRA Features
        run: |
          echo "===== YOUTUBE AND SPOTIFY ====="
          grep -RniE -C 3 "youtube|spotify|launchApp|launchIntent" "$PROJECT/app/src/main" | head -150 || true

          echo "===== MICROPHONE AND SPEAKING ====="
          grep -RniE -C 3 "microphone|AudioRecord|stopSpeaking|TextToSpeech|MediaPlayer" "$PROJECT/app/src/main" | head -150 || true

          echo "===== COMMAND HANDLER ====="
          grep -RniE -C 3 "command|AccessibilityService|startActivity" "$PROJECT/app/src/main/java" | head -150 || true

          echo "===== ANDROID MANIFEST ====="
          cat "$PROJECT/app/src/main/AndroidManifest.xml"

      - name: Verify Kotlin Code
        run: |
          grep -n -A38 "fun findAppByKeywords" "$PROJECT/app/src/main/java/com/myra/assistant/automation/AppDetector.kt"

      - name: Grant Gradle Permission
        run: |
          chmod +x "$PROJECT/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-JARVIS-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
