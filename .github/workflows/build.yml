
name: Build MYRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -q MYRA_JARVIS_OnePack.zip -d extracted

      - name: Find Project
        run: |
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name gradlew -type f | head -1)")
          chmod +x "$PROJECT/gradlew"
          cd "$PROJECT"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
